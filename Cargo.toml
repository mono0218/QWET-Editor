[package]
name = "qwet-editor"
version = "0.1.0"
edition = "2021"

[lib]
name = "qwet_editor"
path = "src/lib.rs"

[[bin]]
name = "qwet-editor"
path = "src/main.rs"

[dependencies]
bevy = { version = "0.15.3", features = ["dynamic_linking", "serialize", "multi_threaded", "jpeg"] }
bevy_egui = "0.32.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15.0"
tokio = { version = "1.0", features = ["rt"] }
futures-lite = "2.0"
rand = "0.9.2"
rodio = "0.20.1"
base64 = "0.22.0"
reqwest = { version = "0.12.0", features = ["json"] }

# 開発時の最適化設定
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# リリースビルド最適化
[profile.release]
lto = "thin"
codegen-units = 1
