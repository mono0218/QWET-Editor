[package]
name = "qwet-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15.3", features = ["dynamic_linking", "serialize", "multi_threaded", "jpeg"] }
bevy_egui = "0.32.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15.0"
tokio = { version = "1.0", features = ["rt"] }
futures-lite = "2.0"
rand = "0.9.2"
rodio = "0.19.0"
